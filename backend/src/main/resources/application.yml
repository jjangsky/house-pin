spring:
  application:
    name: house-pin-api
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 100
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  cache:
    type: caffeine

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html
